spring.application.name=pottel-reporting

# Render cấp cổng qua biến PORT. Chạy trên máy bạn thì mặc định 8080.
server.port=${PORT:8080}

# Thông tin database lấy từ biến môi trường (không ghi mật khẩu vào file).
# Chạy trên máy: chỉ cần đặt DB_PASSWORD, hai biến còn lại có giá trị mặc định.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pottel_bss}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false

# Neon tự tắt database khi không dùng, nên đặt thời gian chờ kết nối dài hơn
# và đóng kết nối cũ sớm để tránh dùng lại kết nối đã bị ngắt.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=60000

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
